  @keyframes rise {

<script>
  // Звёздное небо: мерцающие звёзды в трёх слоях глубины, лёгкий параллакс от мыши
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let w, h, dpr, stars = [];
  let mx = 0, my = 0, tx = 0, ty = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    const count = Math.floor((innerWidth * innerHeight) / 5500);
    stars = Array.from({ length: count }, () => {
      const depth = Math.random();            // 0 — далеко, 1 — близко
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: (0.4 + depth * 1.3) * dpr,
        depth,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 1.2
      };
    });
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    mx += (tx - mx) * 0.04;
    my += (ty - my) * 0.04;

    for (const s of stars) {
      const twinkle = reduceMotion ? 0.8 : 0.55 + 0.45 * Math.sin(t / 1000 * s.speed + s.phase);
      const ox = mx * s.depth * 24 * dpr;
      const oy = my * s.depth * 24 * dpr;
      ctx.globalAlpha = twinkle * (0.35 + s.depth * 0.65);
      ctx.fillStyle = s.depth > 0.8 ? "#8fdcff" : "#eef1ff";
      ctx.beginPath();
      ctx.arc((s.x + ox + w) % w, (s.y + oy + h) % h, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduceMotion) requestAnimationFrame(draw);
  }

  addEventListener("resize", () => { resize(); if (reduceMotion) draw(0); });
  addEventListener("pointermove", (e) => {
    tx = e.clientX / innerWidth - 0.5;
    ty = e.clientY / innerHeight - 0.5;
  });

  resize();
  requestAnimationFrame(draw);
</script>
